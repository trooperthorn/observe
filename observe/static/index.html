<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>observe</title>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <h1>observe</h1>
  <div id="summary" aria-live="polite"></div>
  <a href="/map" class="home">map</a>
  <span id="plugin-nav"></span>
  <label class="filter"><input type="checkbox" id="problems-only"> problems only</label>
</header>
<main id="groups"></main>
<section id="capacity-panel" hidden>
  <h2>Capacity outlook</h2>
  <ol id="capacity"></ol>
</section>
<section id="findings-panel" hidden>
  <h2>Field findings</h2>
  <p class="note">From field tests. These never send alerts.</p>
  <ul id="findings" class="findings"></ul>
</section>
<section id="events-panel">
  <h2>Recent state changes</h2>
  <ol id="events"></ol>
</section>
<footer id="footer"></footer>
<template id="row-tpl">
  <li class="mon">
    <button class="head" type="button" aria-expanded="false">
      <span class="dot"></span>
      <span class="name"></span>
      <span class="val"></span>
    </button>
    <div class="sub"><span class="type"></span> <span class="target"></span> <a class="hostlink" hidden>hardware</a></div>
    <div class="msg"></div>
    <div class="fc"></div>
    <div class="more" hidden>
      <svg class="spark" viewBox="0 0 300 60" preserveAspectRatio="none" role="img"></svg>
      <div class="avail"></div>
      <ol class="mon-events"></ol>
    </div>
  </li>
</template>
<script src="/static/app.js"></script>
</body>
</html>
