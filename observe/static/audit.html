<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit - Observe</title>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/shell.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<header id="shell-header" class="shell-head">
  <div id="summary" aria-live="polite"></div>
</header>
<nav id="shell-nav" aria-label="Main"></nav>
<main class="admin-main" id="page">
  <div class="admin-title">
    <p class="crumbs muted">Admin / Audit</p>
    <h1>Audit</h1>
  </div>
  <p id="msg" class="msg-line" role="alert"></p>
  <section class="card" id="audit-card" aria-labelledby="audit-h">
    <h3 id="audit-h">Audit log</h3>
    <p class="card-sub">The newest 500 entries. Secrets are redacted before they are stored.</p>
    <div class="filter-bar" id="filters">
      <label>Actor <input id="f-actor" type="search" maxlength="64" autocomplete="off"></label>
      <label>Kind <select id="f-kind"><option value="">All kinds</option></select></label>
      <fieldset id="f-status"><legend>Status</legend></fieldset>
      <label>Time range
        <select id="f-range">
          <option value="3600">Last hour</option>
          <option value="86400">Last day</option>
          <option value="604800">Last week</option>
          <option value="0" selected>All</option>
        </select>
      </label>
    </div>
    <div id="audit"></div>
  </section>
</main>
<script type="module" src="/static/audit.js"></script>
<script type="module" src="/static/js/shell.js"></script>
</body>
</html>
