<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>map - observe</title>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/shell.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="shell-header" class="shell-head">
  <div id="summary" aria-live="polite"></div>
  <label class="filter">Site <select id="site"><option value="">All sites</option></select></label>
  <label class="filter">Building <select id="building"><option value="">All buildings</option></select></label>
</header>
<nav id="shell-nav" aria-label="Main"></nav>
<main class="mappage">
  <p id="msg" role="alert"></p>
  <p class="note">Each box shows its state in words as well as colour. Dashed lines are links not confirmed for a while.</p>
  <div id="layers" class="layers"></div>
  <section>
    <h2>Links</h2>
    <table id="links" class="items"><thead><tr><th>From</th><th>To</th><th>Source</th><th>Seen</th><th>State</th></tr></thead><tbody></tbody></table>
  </section>
</main>
<footer id="footer"></footer>
<script type="module" src="/static/pages/map.js"></script>
<script type="module" src="/static/js/shell.js"></script>
</body>
</html>
