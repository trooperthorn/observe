<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>watchpost sign in</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header><h1>watchpost</h1></header>
<main>
  <form id="login" autocomplete="on">
    <p><label>Username <input name="username" autocomplete="username" required maxlength="64"></label></p>
    <p><label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="256"></label></p>
    <p><button type="submit">Sign in</button></p>
    <p id="msg" role="alert"></p>
  </form>
</main>
<script src="/static/login.js"></script>
</body>
</html>
