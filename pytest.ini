[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = plugins/pockethernet plugins/control plugins/unifi
filterwarnings =
    # Third-party only. fastapi.testclient imports starlette's httpx based client, which
    # Starlette itself now deprecates; nothing in Observe can change that.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
    # Third-party only. ldap3 imports renamed pyasn1 names (tagMap, typeMap).
    ignore:(tagMap|typeMap) is deprecated:DeprecationWarning:ldap3.*
