# observe example configuration.
# Addresses use the RFC 5737 documentation ranges and *.lab.example names.
# Secrets are references, never literals:
#   ${NAME}              environment variable (startup fails if unset)
#   ${file:/run/secrets/name}   file contents, trailing newline stripped

# Database. SQLite (the default, server.db_path below) suits a Raspberry Pi. PostgreSQL with
# TimescaleDB suits a larger host; start the compose postgres profile and uncomment this block.
# The connection string carries no password: it is read from the secret file.
# storage:
#   backend: postgres
#   dsn: postgresql://observe@postgres:5432/observe
#   password_file: /run/secrets/observe_db_password
#   timescaledb: auto   # auto uses TimescaleDB when the database has it; on requires it; off never

# Optional OTLP export to a collector (README, "Exporting to an OpenTelemetry collector").
# export:
#   otlp:
#     endpoint: https://collector.example.net:4318
#     headers:
#       Authorization: ${file:/run/secrets/otlp_authorization}

server:
  listen: 0.0.0.0
  port: 8080
  db_path: /data/observe.db
  retention_days: 30
  # The audit log has its own retention, separate from polls and host samples.
  audit_retention_days: 365
  ingest_rate_per_minute: 120  # POST /v1/metrics and /v1/logs requests per ingest key per minute (wrong keys: per peer)
  # plugin_rate_per_minute: 300  # requests per peer to /api/plugins/* routes
  # The address install commands tell hosts to call, http(s)://host[:port] with no path and never
  # localhost. When unset, an admin confirms one in the Add host wizard. The request's Host
  # header is never used.
  # public_url: https://observe.lab.example:8443
  # The /api/v2 read API. It takes a console login or a read token (wpr_, made by an admin in
  # the key screen), never basic auth. Anonymous reads are off; turn them on only for a kiosk on
  # a trusted network. The audit, admin and hardware inventory routes still need a login.
  # anonymous_read: false
  # api_rate_per_second: 20   # requests per second per login, token or (anonymous) peer
  # api_burst: 40
  # api_auth_cache_s: 5       # a revoked login or token stops working within this many seconds
  # The Updates page (/admin/updates, README "Updating"). update_check lets Observe ask the
  # GitHub API, at most once an hour, for the newest commit on main and the latest release of
  # github.com/trooperthorn/observe. The request carries nothing but the repository path,
  # times out in 10 s, follows no redirect and reads at most 1 MB; a failure shows as
  # "could not check". Off by default: it is the one outbound request that is not to a
  # device you monitor. update_dir is where the Update button writes its request for the host
  # helper (scripts/install-updater.sh) and where the helper reports progress.
  # update_check: false
  # update_dir: /data/update
  # Logins (create the first admin with --create-admin). Defaults shown.
  # session_idle_s: 1800
  # session_absolute_s: 43200
  # session_cookie_secure: true   # false only for plain HTTP on a trusted network
  # login_max_failures: 5
  # login_lock_s: 900
  # login_rate_per_minute: 20
  # login_global_per_minute: 120  # logins from all peers together
  # Optional HTTP basic auth for the dashboard and API. Put a TLS reverse
  # proxy in front if you enable this, basic auth over plain HTTP is not
  # confidential.
  basic_auth_user: ops
  basic_auth_password: ${OBSERVE_UI_PASSWORD}

# Infrastructure map (docs/FIELD-DATA.md). Links not confirmed for stale_days are drawn faded,
# and hidden after twice that. With auto_depends, a dependency confirmed by LLDP or CDP within
# stale_days is applied to the rollup; weaker ones wait for an admin to accept them.
map:
  stale_days: 90
  auto_depends: true

# Capacity forecasting, applied to monitors with forecast: true.
forecast:
  lookback_days: 7      # history fitted
  min_points: 24        # hourly buckets needed before projecting
  min_span_hours: 24
  horizon_days: 90      # further-out crossings are reported as beyond horizon
  min_r2: 0.5           # below this a projection is labelled low confidence

# Discovery: `python -m observe --config ... --discover --out proposals.yaml`
# scans these targets and writes proposed monitors. It changes nothing.
discovery:
  targets: [192.0.2.0/24, 198.51.100.10-198.51.100.40, dc01.lab.example]
  exclude: [192.0.2.1]
  credentials: [snmp-v3-core, snmp-v2-legacy, win-monitor, linux-key, truenas-ro, pve-audit,
                esxi-ro, ha-token, unifi-key, technitium-token, mqtt-monitor]
  api_require_valid_tls: true             # TrueNAS/Proxmox/vSphere: pin or CA-sign first
  max_guests: 50
  # Also scan every enabled, recently active computer account in AD.
  directory:
    server: dc01.lab.example              # must match the DC's LDAPS certificate
    credential: ad-reader
    base_dn: "DC=lab,DC=example"          # or an OU to narrow it
    stale_days: 60
    os_include: []                        # e.g. ["Windows Server", "Linux"]
  ssh_known_hosts: /config/known_hosts
  ssh_trust_on_first_use: true            # key credentials only; keys recorded for review
  docker_command: docker                  # or "sudo -n docker"; see THREAT-MODEL.md
  ca_bundle: /config/lab-root-ca.pem     # WinRM creds are sent only if TLS validates
  max_auth_failures: 3                   # a rejected credential is retired after this
  max_hosts: 4096
  concurrency: 64
  timeout: 1.5

defaults:
  interval: 60          # seconds between polls
  timeout: 5            # seconds per probe
  failures_to_down: 3   # consecutive FAILs before DOWN (and an alert)
  recoveries_to_up: 1   # consecutive OKs before UP
  recheck_interval: 10  # seconds between checks while a monitor is Degraded (minimum 5)
  recheck_window: 180   # seconds of Degraded before DOWN; 0 turns the re-check off
  recheck_good: 2       # good replies in a row that return a Degraded monitor to UP

credentials:
  snmp-v2-legacy:
    type: snmpv2c
    community: ${SNMP_COMMUNITY}
  snmp-v3-core:
    type: snmpv3
    username: observe
    level: authPriv
    auth_protocol: SHA-256
    auth_password: ${SNMP_AUTH}
    priv_protocol: AES
    priv_password: ${SNMP_PRIV}
  win-monitor:
    type: winrm
    transport: ntlm
    username: LAB\svc-observe
    password: ${WINRM_PASSWORD}
  # Certificate-mapped WinRM (no password on the wire or on disk here).
  win-monitor-cert:
    type: winrm
    transport: certificate
    cert_pem: /run/secrets/winrm-client.crt
    cert_key_pem: /run/secrets/winrm-client.key
  # Kerberos WinRM: no password anywhere, only a keytab. Requires mounting
  # /etc/krb5.conf and the keytab (see README "Windows (WinRM and WMI)").
  win-monitor-krb:
    type: winrm
    transport: kerberos
    principal: observe@LAB.EXAMPLE.COM
    keytab_path: /run/secrets/observe.keytab
    # Only set this if the target's SPN host differs from the monitor's
    # `host:` (for example, a CNAME or load-balanced name).
    # kerberos_hostname_override: winsrv01.lab.example.com
  linux-key:
    type: ssh
    username: observe
    private_key: /run/secrets/observe_ed25519   # key-based; no password needed
  ad-reader:
    type: ldap
    bind_user: svc-observe@lab.example
    password: ${AD_PASSWORD}
  truenas-ro:
    type: truenas
    username: observe              # a user with the READONLY_ADMIN role
    api_key: ${TRUENAS_API_KEY}
  pve-audit:
    type: proxmox
    token_id: observe@pve!monitor  # token on a user with PVEAuditor
    secret: ${PROXMOX_TOKEN_SECRET}
  esxi-ro:
    type: vsphere
    username: observe@lab.example  # a read-only role on the host or vCenter
    password: ${VSPHERE_PASSWORD}
  ha-token:
    type: homeassistant
    token: ${HA_TOKEN}               # long-lived token of a dedicated non-admin user
  unifi-key:
    type: unifi
    api_key: ${UNIFI_API_KEY}        # one key serves Network and Protect
  technitium-token:
    type: technitium
    token: ${TECHNITIUM_TOKEN}       # user with only Dashboard: View
  mqtt-monitor:
    type: mqtt
    username: observe
    password: ${MQTT_PASSWORD}

alerts:
  - name: phone
    type: ntfy
    url: https://ntfy.lab.example/homelab
    token: ${NTFY_TOKEN}
    notify_on: [down, up]
  - name: home-assistant
    type: mqtt
    host: mqtt.lab.example
    port: 8883
    tls: true
    ca_bundle: /config/lab-root-ca.pem
    credential: mqtt-monitor
    topic_prefix: observe
    notify_on: [down, warn, up]

monitors:
  # ---------------------------------------------------------- reachability
  - name: Gateway
    group: network
    type: ping
    host: 192.0.2.1
    interval: 30
    # Once a threshold holds, the value must come back past it by `hysteresis` (in the value's
    # unit) before it clears, so a value hovering at the line does not flap between Warning and
    # Up. Leave it out for 5% of each threshold (here 1 ms for warn, 5 ms for crit); 0 turns it off.
    # It must also stay back for `clear_polls` polls in a row before it clears (default 3, like
    # a threshold rule's `clear`); 1 clears on the first good poll.
    thresholds: {direction: above, warn: 20, crit: 100}   # avg RTT ms

  - name: Core switch
    group: network
    type: ping
    host: 192.0.2.2

  - name: NAS SSH
    group: storage
    type: tcp
    host: nas.lab.example
    port: 22
    expect: SSH-2.0
    depends_on: [Core switch]     # UNREACHABLE, not DOWN, while the switch is down

  - name: Guest AP
    group: network
    type: ping
    host: 192.0.2.30
    depends_on: [Core switch]
    critical: false               # can turn "network" WARN, never DOWN

  # ---------------------------------------------------------- web and names
  - name: Home Assistant UI
    group: apps
    type: http
    url: https://ha.lab.example:8123/manifest.json
    expect_status: [200]
    ca_bundle: /config/lab-root-ca.pem

  - name: Internal DNS
    group: network
    type: dns
    query: ha.lab.example
    record: A
    nameserver: 192.0.2.53
    expect: [192.0.2.20]

  - name: HA certificate
    group: pki
    type: tls_cert
    host: ha.lab.example
    port: 8123
    ca_bundle: /config/lab-root-ca.pem
    interval: 3600
    # default thresholds: warn at 21 days, fail at 7

  # ------------------------------------------------------------------- SNMP
  - name: Core switch uplink
    group: network
    type: snmp
    host: 192.0.2.2
    credential: snmp-v3-core
    mode: interface
    interface: "Port 24"            # ifName, ifDescr, or numeric ifIndex
    thresholds: {direction: above, warn: 70, crit: 90}   # % utilization
    forecast: true                  # project when the trend reaches 70% and 90%

  - name: Core switch uptime
    group: network
    type: snmp
    host: 192.0.2.2
    credential: snmp-v3-core
    mode: uptime                    # WARNs once when the agent restarts

  # Disks over SNMP. With host_name the readings (and any cpu, memory or interface
  # monitor that names the same host) also show on that host's page. Use the same name
  # as a homeassistant host mode monitor to see the HA SOC Probe beside its API readings.
  - name: HA Probe disks
    group: servers
    type: snmp
    host: ha.lab.example
    credential: snmp-v3-core
    mode: storage
    mount: /data                    # optional: one hrStorageDescr; default every fixed disk
    host_name: homeassistant
    thresholds: {direction: above, warn: 85, crit: 95}

  - name: Pi CPU
    group: servers
    type: snmp
    host: pi.lab.example
    credential: snmp-v3-core
    mode: cpu
    thresholds: {direction: above, warn: 85, crit: 97}

  - name: Pi memory
    group: servers
    type: snmp
    host: pi.lab.example
    credential: snmp-v3-core
    mode: memory
    thresholds: {direction: above, warn: 90, crit: 97}
    depends_on: [Core switch]

  - name: UPS battery
    group: power
    type: snmp
    host: 192.0.2.40
    credential: snmp-v2-legacy
    mode: oid
    oid: .1.3.6.1.2.1.33.1.2.4.0    # UPS-MIB upsEstimatedChargeRemaining
    thresholds: {direction: below, warn: 60, crit: 30}

  # ------------------------------------------------- Windows (over WinRM)
  - name: DC01 Netlogon
    group: identity
    type: winrm
    host: dc01.lab.example
    credential: win-monitor
    ca_bundle: /config/lab-root-ca.pem
    mode: service
    service: Netlogon

  - name: DC01 C drive
    group: identity
    type: winrm
    host: dc01.lab.example
    credential: win-monitor
    ca_bundle: /config/lab-root-ca.pem
    mode: disk
    disk: "C:"
    thresholds: {direction: above, warn: 85, crit: 95}
    forecast: true

  - name: CA01 cert services
    group: pki
    type: winrm
    host: ca01.lab.example
    credential: win-monitor-cert
    ca_bundle: /config/lab-root-ca.pem
    mode: service
    service: CertSvc

  - name: DC01 stopped auto services
    group: identity
    type: wmi
    host: dc01.lab.example
    credential: win-monitor
    ca_bundle: /config/lab-root-ca.pem
    query: "SELECT Name FROM Win32_Service WHERE StartMode='Auto' AND State<>'Running'"
    property: Name
    aggregate: count
    thresholds: {direction: above, warn: 1, crit: 3}

  # ------------------------------------------------------ Linux (over SSH)
  - name: Pi root disk
    group: linux
    type: linux
    host: pi.lab.example
    credential: linux-key
    known_hosts: /config/known_hosts
    mode: disk
    mount: /
    thresholds: {direction: above, warn: 85, crit: 95}
    forecast: true

  - name: Pi docker daemon
    group: linux
    type: linux
    host: pi.lab.example
    credential: linux-key
    mode: service
    service: docker

  # ------------------------------------------------------ Docker (over SSH)
  - name: Pi containers
    group: docker
    type: docker
    host: pi.lab.example
    credential: linux-key
    mode: summary          # FAIL if any container is unhealthy or stopped despite its restart policy

  - name: Home Assistant container
    group: docker
    type: docker
    host: pi.lab.example
    credential: linux-key
    mode: container
    container: homeassistant

  # ---------------------------------------------------------------- TrueNAS
  - name: NAS pools
    group: storage
    type: truenas
    host: nas.lab.example
    credential: truenas-ro
    ca_bundle: /config/lab-root-ca.pem
    mode: pools                          # FAIL on any unhealthy pool

  - name: NAS pool tank
    group: storage
    type: truenas
    host: nas.lab.example
    credential: truenas-ro
    ca_bundle: /config/lab-root-ca.pem
    mode: pool
    pool: tank
    thresholds: {direction: above, warn: 80, crit: 90}
    forecast: true

  - name: NAS alerts
    group: storage
    type: truenas
    host: nas.lab.example
    credential: truenas-ro
    ca_bundle: /config/lab-root-ca.pem
    mode: alerts
    min_alert_level: WARNING

  # ---------------------------------------------------------------- Proxmox
  - name: pve1 node
    group: proxmox
    type: proxmox
    host: pve1.lab.example
    credential: pve-audit
    ca_bundle: /config/pinned/pve1.pem   # the node's own self-signed cert, pinned
    mode: node
    node: pve1

  - name: pve1 pihole CT
    group: proxmox
    type: proxmox
    host: pve1.lab.example
    credential: pve-audit
    ca_bundle: /config/pinned/pve1.pem
    mode: guest
    guest: "200"                         # VMID, or the guest's name
    depends_on: [pve1 node]

  # ---------------------------------------------------------------- vSphere
  - name: esxi01
    group: vsphere
    type: vsphere
    host: esxi01.lab.example
    credential: esxi-ro
    ca_bundle: /config/lab-root-ca.pem
    mode: host                           # connection, maintenance, alarm colour

  - name: esxi01 datastore1
    group: vsphere
    type: vsphere
    host: esxi01.lab.example
    credential: esxi-ro
    ca_bundle: /config/lab-root-ca.pem
    mode: datastore
    entity: datastore1
    thresholds: {direction: above, warn: 85, crit: 95}
    forecast: true

  - name: esxi01 VM dc02
    group: vsphere
    type: vsphere
    host: esxi01.lab.example
    credential: esxi-ro
    ca_bundle: /config/lab-root-ca.pem
    mode: vm
    entity: dc02
    depends_on: [esxi01]

  # --------------------------------------------------------- Home Assistant
  - name: Home Assistant API
    group: homeassistant
    type: homeassistant
    host: ha.lab.example
    credential: ha-token
    https: false              # HA's default; the token then crosses the LAN in cleartext
    mode: api

  - name: Home Assistant host
    group: homeassistant
    type: homeassistant
    host: ha.lab.example
    credential: ha-token
    https: false
    mode: host                # versions, updates, entity counts and hassio sensors as a host page
    host_name: homeassistant  # the name shown on the Hosts page; polled every 300 s by default

  - name: HA unavailable entities
    group: homeassistant
    type: homeassistant
    host: ha.lab.example
    credential: ha-token
    https: false
    mode: unavailable
    ignore: ["media_player.*_zone4"]      # known-dead entities, fnmatch patterns
    thresholds: {direction: above, warn: 1, crit: 25}

  - name: NAS temperature (from HA)
    group: homeassistant
    type: homeassistant
    host: ha.lab.example
    credential: ha-token
    https: false
    mode: entity
    entity_id: sensor.nas_temperature
    thresholds: {direction: above, warn: 45, crit: 55}

  # ---------------------------------------------------------- UniFi Network
  - name: UniFi devices
    group: unifi
    type: unifi_network
    host: unifi.lab.example
    credential: unifi-key
    ca_bundle: /config/pinned/unifi.pem
    mode: devices             # FAIL when any adopted device is not ONLINE
    ignore: ["Old Garage Switch"]

  - name: Gateway CPU
    group: unifi
    type: unifi_network
    host: unifi.lab.example
    credential: unifi-key
    ca_bundle: /config/pinned/unifi.pem
    mode: device_cpu
    device: Gateway           # name or MAC
    thresholds: {direction: above, warn: 80, crit: 90}

  # ---------------------------------------------------------- UniFi Protect
  - name: Protect cameras
    group: protect
    type: unifi_protect
    host: unifi.lab.example
    credential: unifi-key
    ca_bundle: /config/pinned/unifi.pem
    mode: cameras             # FAIL when any camera is not CONNECTED

  # ------------------------------------------------------------- Technitium
  - name: Technitium SERVFAIL rate
    group: dns
    type: technitium
    host: dns.lab.example
    credential: technitium-token
    mode: stats
    # A rate near 2% clears only below 1.75%.
    thresholds: {direction: above, warn: 2, crit: 10, hysteresis: 0.25}

  - name: Technitium answers
    group: dns
    type: dns
    query: ha.lab.example
    nameserver: 192.0.2.53
    depends_on: [Technitium SERVFAIL rate]

  # ------------------------------------------------------------------ MQTT
  - name: Broker
    group: apps
    type: mqtt
    host: mqtt.lab.example
    port: 8883
    tls: true
    ca_bundle: /config/lab-root-ca.pem
    credential: mqtt-monitor

  - name: Zigbee2MQTT bridge
    group: apps
    type: mqtt
    host: mqtt.lab.example
    port: 8883
    tls: true
    ca_bundle: /config/lab-root-ca.pem
    credential: mqtt-monitor
    topic: zigbee2mqtt/bridge/state
    expect: online

  # ------------------------------------------------- Pushed hosts (hostwatch)
  # The agent pushes OTLP to POST /v1/metrics and /v1/logs with a key from
  # --ingest-key-create nas01. Listing the host here is what makes it a
  # monitor. No batch within stale_after seconds counts as a failure. Left
  # unset, the limit is the larger of three intervals and 2.5 times the host's
  # Availability tier rate (/admin/tiers); each reading is stale after 2.5
  # times the rate of its own tier.
  - name: nas01
    group: storage
    type: pushed_host
    host: nas01
    depends_on: [Core switch]
    require_sources: [mdraid]
    # A crash boot warns for this long (default 3600). crash_result: fail makes it DOWN.
    crash_hold_s: 3600
    crash_result: warn
    components:
      - {source: hostwatch.collector.hwmon, metric: hw.temperature, direction: above, warn: 75, crit: 90}

# Plugins (observe/plugins.py). Only names listed here are loaded.
# plugins: [pockethernet, control, unifi]
# plugin_settings:
#   pockethernet:
#     evidence_retention_days: 365  # how long a report body is kept
#   control:
#     signing_key_file: /run/secrets/observe_control_key   # from --control-keygen
#   unifi:
#     host: 192.0.2.1
#     credential: unifi_key        # a credential of type unifi
#     site: Default                # the only site when omitted
#     interval: 120                # seconds between device polls
#     retention_days: 30           # delete devices unseen this long
#     clients_interval: 300        # seconds between client polls
#     protect: false               # true polls Protect cameras with the same key
#     protect_interval: 120
#     # classic_credential: unifi_view   # optional, type unifi_classic; adds offline clients,
#     #                                  # switch ports and SSIDs, PoE, VLAN and LLDP
