[project]
name = "observe-pockethernet"
dynamic = ["version"]
description = "Pockethernet field reports for Observe"
requires-python = ">=3.12"

[project.entry-points."observe.plugins"]
pockethernet = "observe_pockethernet:plugin"

[tool.setuptools]
packages = ["observe_pockethernet"]

[tool.setuptools.package-data]
observe_pockethernet = ["pages/*.html", "static/*.js", "static/*.css"]

[tool.setuptools.dynamic]
version = {attr = "observe_pockethernet.__version__"}
