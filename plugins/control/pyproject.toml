[project]
name = "observe-control"
dynamic = ["version"]
description = "Signed control actions for Observe"
requires-python = ">=3.12"
dependencies = ["cryptography"]

[project.entry-points."observe.plugins"]
control = "observe_control:plugin"

[tool.setuptools]
packages = ["observe_control"]

[tool.setuptools.dynamic]
version = {attr = "observe_control.__version__"}
